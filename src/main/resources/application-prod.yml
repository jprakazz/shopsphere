# Production profile: MySQL (RDS), Redis (ElastiCache) and Kafka (MSK).
# Every value comes from the environment so no secret is committed.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopsphere}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: none
  cache:
    type: redis
    redis:
      time-to-live: 10m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shopsphere-notifications
      auto-offset-reset: earliest

management:
  health:
    redis:
      enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@shopsphere.dev}
    password: ${APP_ADMIN_PASSWORD}
  seed-sample-data: ${APP_SEED_SAMPLE_DATA:false}
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
