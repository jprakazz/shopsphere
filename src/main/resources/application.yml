spring:
  application:
    name: shopsphere
  autoconfigure:
    # Users authenticate with JWTs issued by AuthService; the default in-memory user is not needed.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Default profile runs fully in-memory so the project starts with no external services.
    url: jdbc:h2:mem:shopsphere;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        # Lazy associations of a page of results load in one IN (...) query instead of one query per row.
        # Used for product -> category in catalogue search, where a JOIN made the optimiser skip the name index.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  cache:
    type: simple
    cache-names: products,product,categories
  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Development-only secret. Production reads APP_JWT_SECRET (see application-prod.yml).
    secret: dev-only-secret-change-me-dev-only-secret-change-me-0123456789
    expiration-minutes: 60
  admin:
    email: admin@shopsphere.dev
    password: Admin@123
  seed-sample-data: true
  kafka:
    enabled: false
    order-topic: shopsphere.orders
