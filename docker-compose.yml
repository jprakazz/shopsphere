# Runs ShopSphere with the same moving parts as production:
# MySQL (RDS in AWS), Redis (ElastiCache) and Kafka (MSK).
#   docker compose up --build
# Credentials below are for local use only.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_USER: shopsphere
      MYSQL_PASSWORD: shopsphere-local
      MYSQL_ROOT_PASSWORD: root-local
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  app:
    build: .
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: shopsphere
      DB_USER: shopsphere
      DB_PASSWORD: shopsphere-local
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: local-compose-secret-local-compose-secret-0123
      APP_ADMIN_PASSWORD: Admin@123
      APP_SEED_SAMPLE_DATA: "true"

volumes:
  mysql-data:
